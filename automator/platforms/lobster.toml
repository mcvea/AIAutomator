# LobsterAI（网易有道桌面 Agent）平台定义
# 登录态：SQLite kv 表 auth_tokens.accessToken
# 路径：%APPDATA%\LobsterAI\lobsterai.sqlite
# 签到：hook_checkin 完整接管（slot → context → check_in 三步）
# 积分到期：profile-summary creditItems（hooks 提供）

[platform]
name = "lobster"
display = "LobsterAI"
daily_credits = 100
enabled = true

[platform.auth]
type = "sqlite_kv"
path = "%APPDATA%\\LobsterAI\\lobsterai.sqlite"
kv_key = "auth_tokens"
token_field = "accessToken"

[platform.hooks]
checkin = "lobster_checkin"
health = "lobster_checkin"
credits = "lobster_checkin"
total = "lobster_checkin"

# 积分到期（profile-summary creditItems）
[platform.credits]
enabled = true
api = "credits"

[platform.apis.credits]
method = "GET"
url = "https://lobsterai-server.youdao.com/api/user/profile-summary?firstKeyfrom=official"
auth = "bearer"
