# 百度搭子 DuMate（千帆桌面）平台定义
# 登录态：auth.json 加密 cookies（hooks/dumate_crypto 解密，AES-256-GCM + .cookie-key）
# 路径：%APPDATA%\qianfan-desktop-app\auth.json（及同目录 .cookie-key）
# 鉴权：Cookie 头 + csrftoken（由 auth_store 自动生成，模板注入）
# 积分到期：quota_overview 声明式解析 + hooks 增量补充

[platform]
name = "dumate"
display = "百度搭子 DuMate"
daily_credits = 500
enabled = true

[platform.auth]
type = "cookie_jar"
path = "%APPDATA%\\qianfan-desktop-app\\auth.json"
key_file = "%APPDATA%\\qianfan-desktop-app\\.cookie-key"
target_host = "console.bce.baidu.com"

[platform.hooks]
cookies_decrypt = "dumate_crypto"
health = "dumate_crypto"
credits = "dumate_crypto"

[platform.extra_headers]
Cookie = "{{cookie_str}}"
csrftoken = "{{csrf_token}}"
Origin = "https://console.bce.baidu.com"
Referer = "https://console.bce.baidu.com/"
X-Requested-With = "XMLHttpRequest"

[platform.apis.checkin_status]
method = "GET"
url = "https://console.bce.baidu.com/api/dumate/points/loginBonusInfo"
auth = "raw"

[platform.apis.checkin_status.parse]
already = "result.hasIssued == true"

[platform.apis.checkin_status.parse.fields]
total = "result.totalPoints"

[platform.apis.checkin]
method = "POST"
url = "https://console.bce.baidu.com/api/dumate/points/loginBonus"
body = "{}"
auth = "raw"

[platform.apis.checkin.parse]
already = "result.success == false"

# 积分到期（quota_overview，完整列表由 hooks/dumate_crypto.credits 提供）
[platform.credits]
enabled = true
api = "credits"

[platform.apis.credits]
method = "GET"
url = "https://console.bce.baidu.com/api/dumate/points/quota_overview?timezone=Asia/Shanghai&clientType=desktop&ignoreLoginBonus=true"
auth = "raw"
