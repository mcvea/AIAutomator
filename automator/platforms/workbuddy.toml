# WorkBuddy（腾讯 AI 办公工作台）平台定义
# 登录态：优先多账号凭据库 auths/workbuddy-<uid>.json（wb_accounts.py 短信登录生成，
#         脚本自动续期，逐账号展开为多行结果）；auths/ 为空时回退本机客户端
#         auth 文件（5.6+ 为 $wbEncrypted 加密信封）。声明式 json_file 无法处理
#         加密信封与多账号，整体走 hooks/workbuddy_checkin 完整接管，同 LobsterAI 模式
# 接口：billing/meter；签到为幂等操作，重复调用只提示"已领过"，不扣积分
# 桌面登录态路径：%LOCALAPPDATA%\CodeBuddyExtension\Data\Public\auth\workbuddy-desktop.info

[platform]
name = "workbuddy"
display = "WorkBuddy"
daily_credits = 100
enabled = true

[platform.hooks]
checkin = "workbuddy_checkin"
health = "workbuddy_checkin"
total = "workbuddy_checkin"

[platform.auth]
type = "json_file"
path = "%LOCALAPPDATA%\\CodeBuddyExtension\\Data\\Public\\auth\\workbuddy-desktop.info"
token_field = "auth.accessToken"
expires_field = "auth.expiresAt"
refresh_expires_field = "auth.refreshExpiresAt"

[platform.apis.checkin_status]
method = "POST"
url = "https://{{auth.domain}}/v2/billing/meter/checkin-activity-status"
body = "{}"
auth = "bearer"

[platform.apis.checkin_status.parse]
already = "data.today_checked_in == true"

[platform.apis.checkin_status.parse.fields]
streak = "data.streak_days"

[platform.apis.checkin]
method = "POST"
url = "https://{{auth.domain}}/v2/billing/meter/daily-checkin"
body = "{}"
auth = "bearer"

[platform.apis.checkin.parse]
already_contains = "已签到|already|重复"
credits = "data.credits"

# 积分到期：签到积分长期有效，不声明 credits 接口
